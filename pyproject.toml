[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsntool"
version = "0.1.0"
description = "Configure, run and analyze OMNeT++/INET TSN simulations (Step 1: launch a chosen TSN showcase config)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tabgab", email = "info@omnest.com" }]
license = { text = "LGPL-3.0-or-later" }

# Core runtime needs no third-party deps (uses the Python stdlib + the OMNeT++
# bundled tools). The GUI needs a Qt binding; results analysis (later steps)
# needs pandas/matplotlib. Kept as optional extras so the CLI works anywhere.
dependencies = []

[project.optional-dependencies]
# GUI needs a Qt binding + matplotlib (Results-tab charts).
gui = ["PySide6>=6.6", "matplotlib>=3.7"]
# Results analysis reads .sca/.vec via the bundled omnetpp.scave native bindings,
# which require pandas + scipy (numpy comes transitively).
analysis = ["pandas>=2.0", "scipy>=1.11"]
# AI assistant: Anthropic SDK for the Claude provider. The Ollama provider needs
# no extra package (stdlib HTTP). Set ANTHROPIC_API_KEY to use Claude.
ai = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
tsntool = "tsntool.cli:main"

[tool.setuptools]
packages = ["tsntool", "tsntool.gui"]
